version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.21
    commands:
      - echo "Checking Go version"
      - go version
      - cd go-employee-api
      - go mod tidy

  build:
    commands:
      - cd go-employee-api
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bootstrap
      - zip function.zip bootstrap

  post_build:
    commands:
      - cd go-employee-api
      - aws lambda update-function-code --function-name Rishikesh-Employee-Lambda --zip-file fileb://function.zip --region us-west-2
